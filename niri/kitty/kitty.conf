# Selandia Glass · scoped to the Niri terminal launcher; no global Kitty changes.
font_family JetBrainsMono Nerd Font
font_size 11.5
window_padding_width 20
hide_window_decorations yes
background #101522
foreground #eef5ff
background_opacity 0.86
selection_background #94dfff
selection_foreground #101522
cursor #94dfff
cursor_text_color #101522
url_color #c4b5fd
active_border_color #94dfff
inactive_border_color #344256
bell_border_color #f4d9a1
active_tab_background #94dfff
active_tab_foreground #101522
inactive_tab_background #1c2638
inactive_tab_foreground #9daec6
tab_bar_style separator
tab_separator "  ·  "
tab_bar_edge bottom
enable_audio_bell no
color0 #253044
color1 #ffb4c4
color2 #a6eed7
color3 #f4d9a1
color4 #94dfff
color5 #c4b5fd
color6 #9de9ee
color7 #d3ddec
color8 #6c7c97
color9 #ffc6d2
color10 #c2f7e7
color11 #f9e7bf
color12 #bcecff
color13 #dacfff
color14 #bcf3f6
color15 #eef5ff
# Control Center preferences / 控制中心的主题与字体设置
include ../theme/kitty.conf
