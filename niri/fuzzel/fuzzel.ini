# Dmenu selection only; applications use Anyrun / 仅用于 dmenu 选择；应用启动使用 Anyrun。
[main]
font=Inter:size=13,Noto Sans CJK SC:size=13
terminal=alacritty
prompt="⌕  "
placeholder=Select an item
icon-theme=Adwaita
icons-enabled=yes
layer=overlay
anchor=center
width=48
lines=8
line-height=36
horizontal-pad=28
vertical-pad=24
inner-pad=16
image-size-ratio=0
match-counter=yes

[colors]
background=101522df
text=eef5ffff
prompt=94dfffff
placeholder=9daec6ff
input=eef5ffff
match=94dfffff
selection=354863cc
selection-text=eef5ffff
selection-match=c4b5fdff
counter=9daec6ff
border=d6eaff55

[border]
width=1
radius=24
selection-radius=12

[dmenu]
exit-immediately-if-empty=yes
