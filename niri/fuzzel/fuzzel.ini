# Dmenu selection only; applications use Anyrun / 仅用于 dmenu 选择；应用启动使用 Anyrun。
[main]
font=Adwaita Sans:pixelsize=15,Noto Sans CJK SC:pixelsize=15
terminal=alacritty
prompt="✦  "
placeholder=Select an item
icon-theme=Adwaita
icons-enabled=yes
layer=overlay
anchor=center
width=48
lines=8
line-height=36
horizontal-pad=28
vertical-pad=24
inner-pad=16
image-size-ratio=0
match-counter=yes

[colors]
background=1a1118f0
text=fff4f8ff
prompt=ff8fbfff
placeholder=ecd3dfff
input=fff4f8ff
match=ff8fbfff
selection=74465eff
selection-text=fff4f8ff
selection-match=ff8fbfff
counter=ecd3dfff
border=ff8fbfa6

[border]
width=1
radius=28
selection-radius=14

[dmenu]
exit-immediately-if-empty=yes
