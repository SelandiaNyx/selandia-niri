# Dmenu selection only; applications use Anyrun / 仅用于 dmenu 选择；应用启动使用 Anyrun。
[main]
font=Adwaita Sans:pixelsize=14,Noto Sans CJK SC:pixelsize=14
terminal=alacritty
prompt="⌕  "
placeholder=Select an item
icon-theme=Adwaita
icons-enabled=yes
layer=overlay
anchor=center
width=48
lines=8
line-height=36
horizontal-pad=28
vertical-pad=24
inner-pad=16
image-size-ratio=0
match-counter=yes

[colors]
background=090d16c7
text=f1f6ffff
prompt=5ee7ffff
placeholder=b9c9deff
input=f1f6ffff
match=5ee7ffff
selection=326a80ff
selection-text=f1f6ffff
selection-match=5ee7ffff
counter=b9c9deff
border=5ee7ffa6

[border]
width=1
radius=26
selection-radius=12

[dmenu]
exit-immediately-if-empty=yes
