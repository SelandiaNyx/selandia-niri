# Dmenu selection only; applications use Anyrun / 仅用于 dmenu 选择；应用启动使用 Anyrun。
[main]
font=Adwaita Sans:pixelsize=14,Noto Sans CJK SC:pixelsize=14
terminal=alacritty
prompt="⌕  "
placeholder=选择条目
icon-theme=Adwaita
icons-enabled=yes
layer=overlay
anchor=center
width=48
lines=8
line-height=36
horizontal-pad=28
vertical-pad=24
inner-pad=16
image-size-ratio=0
match-counter=yes

[colors]
background=0a0e14eb
text=f0f4f8ff
prompt=4c9effff
placeholder=96a5b8ff
input=f0f4f8ff
match=4c9effff
selection=2c4f79ff
selection-text=f0f4f8ff
selection-match=4c9effff
counter=96a5b8ff
border=263342cc

[border]
width=1
radius=26
selection-radius=12

[dmenu]
exit-immediately-if-empty=yes
