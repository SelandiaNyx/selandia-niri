# Dmenu selection only; applications use Anyrun / 仅用于 dmenu 选择；应用启动使用 Anyrun。
[main]
font=Adwaita Sans:pixelsize=15,Noto Sans CJK SC:pixelsize=15
terminal=alacritty
prompt="✦  "
placeholder=选择条目
icon-theme=Adwaita
icons-enabled=yes
layer=overlay
anchor=center
width=48
lines=8
line-height=36
horizontal-pad=28
vertical-pad=24
inner-pad=16
image-size-ratio=0
match-counter=yes

[colors]
background=1b1728f2
text=efeaf8ff
prompt=9da8ffff
placeholder=dfd8eeff
input=efeaf8ff
match=9da8ffff
selection=4c4975ff
selection-text=efeaf8ff
selection-match=9da8ffff
counter=dfd8eeff
border=9da8ffa6

[border]
width=1
radius=28
selection-radius=14

[dmenu]
exit-immediately-if-empty=yes
